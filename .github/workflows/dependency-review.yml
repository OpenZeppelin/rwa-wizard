name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          allow-dependencies-licenses: >-
            pkg:npm/@openzeppelin/adapter-evm,
            pkg:npm/@openzeppelin/adapter-stellar,
            pkg:npm/@openzeppelin/relayer-sdk,
            pkg:npm/@openzeppelin/ui-components,
            pkg:npm/@openzeppelin/ui-dev-cli,
            pkg:npm/@openzeppelin/ui-react,
            pkg:npm/@openzeppelin/ui-renderer,
            pkg:npm/@openzeppelin/ui-storage,
            pkg:npm/@openzeppelin/ui-styles,
            pkg:npm/@openzeppelin/ui-tailwind-utils,
            pkg:npm/@openzeppelin/ui-types,
            pkg:npm/@openzeppelin/ui-utils,
            pkg:npm/@pierre/theming,
            pkg:npm/@pierre/trees
