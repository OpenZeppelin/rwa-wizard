# Codegen Compile Check
# =====================
# Verifies that the default bundled Stellar/Soroban artifact actually compiles
# against the generated upstream pin. Catches drift between the bundled
# template snapshot and the Cargo dependency revision shipped to users.

name: Codegen Compile

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/codegen-rwa-stellar/**'
      - 'packages/config/**'
      - '.github/workflows/codegen-compile.yml'

permissions:
  contents: read

jobs:
  compile:
    name: Compile Generated Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master 2026-02-13
        with:
          toolchain: stable
          targets: wasm32v1-none

      - name: Cache Cargo registry & git
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-stellar-${{ hashFiles('packages/codegen-rwa-stellar/src/upstream/generated-revision.ts') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stellar-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@732870f031d2fb36309d0deaf36abcc704a7be65 # v1.20.1

      - name: Install Stellar CLI
        run: cargo binstall stellar-cli --no-confirm --log-level info

      # Installs workspace dependencies via pnpm install --frozen-lockfile (see .github/actions/prepare).
      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare

      - name: Build codegen packages
        run: pnpm --filter @openzeppelin/codegen-rwa-stellar... build

      - name: Run compilation e2e test
        run: pnpm --filter @openzeppelin/codegen-rwa-stellar exec vitest run __tests__/compile.test.ts --pool=forks --maxWorkers=1 --passWithNoTests
