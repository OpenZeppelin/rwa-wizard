# CI workflow for RWA Wizard monorepo
# =====================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare

      - name: Dependency licence guard
        # Invoked directly rather than through pnpm: it is lockfile-only and needs
        # no node_modules, so this fails fast before the install.
        run: node scripts/check-dependency-licenses.cjs

      - name: Adapter peer version check
        # The adapters enforce ui-* minimums at runtime only, so a stale pin
        # builds and tests clean and then fails in the browser.
        run: pnpm exec oz-ui-dev check-peers --project "$PWD"

      - name: Build all packages
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Type check all packages
        run: pnpm typecheck

      - name: Lint all packages
        # Formatting and the provenance rules (`provenance/no-early-config-read`,
        # the SF-2 compute-early/emit-late guard) are enforced here, not only by
        # the pre-commit hook a contributor can skip.
        run: pnpm lint

      - name: Package tests
        # The headless packages have no kit dependency, so their suites — the
        # golden byte-identity guard, the provenance suites, the config schema —
        # are a hard gate. Kept separate from `Test` below on purpose.
        run: pnpm -r --filter '!@openzeppelin/rwa-wizard-app' test

      # Three invocations, each expected to exit 0: the checks themselves; the
      # self-check, which forces the column visible at every width and requires
      # V1 and V3 to FAIL, each for its own named reason; and a negative run
      # against a page that never rendered the drawer, which requires the probe
      # to fail closed naming the missing precondition. The last two exist
      # because a guard that has never been watched failing is not evidence.
      - name: Drawer layout probe
        run: |
          node apps/rwa-wizard/scripts/layout-probe.mjs
          PROBE_SELF_CHECK=1 node apps/rwa-wizard/scripts/layout-probe.mjs
          PROBE_NEGATIVE=1 node apps/rwa-wizard/scripts/layout-probe.mjs

      - name: Test
        run: pnpm test
