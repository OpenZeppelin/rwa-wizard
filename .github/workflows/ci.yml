# CI workflow for RWA Wizard monorepo
# =====================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare

      - name: Dependency licence guard
        # Invoked directly rather than through pnpm: it is lockfile-only and needs
        # no node_modules, so this fails fast before the install.
        run: node scripts/check-dependency-licenses.cjs

      - name: Adapter peer version check
        # The adapters enforce ui-* minimums at runtime only, so a stale pin
        # builds and tests clean and then fails in the browser.
        run: node scripts/check-adapter-peers.cjs

      - name: Build all packages
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Type check all packages
        run: pnpm typecheck

      - name: Test
        run: pnpm test
        continue-on-error: true
