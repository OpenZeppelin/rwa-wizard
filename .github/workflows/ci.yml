# CI workflow for RWA Wizard monorepo
# =====================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare

      - name: Dependency licence guard
        # Invoked directly rather than through pnpm: it is lockfile-only and needs
        # no node_modules, so this fails fast before the install.
        run: node scripts/check-dependency-licenses.cjs

      - name: Adapter peer version check
        # The adapters enforce ui-* minimums at runtime only, so a stale pin
        # builds and tests clean and then fails in the browser.
        run: pnpm exec oz-ui-dev check-peers --project "$PWD"

      - name: Build all packages
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Type check all packages
        run: pnpm typecheck

      - name: Test
        run: pnpm test
