# Release workflow for RWA Wizard
# =====================================
# This workflow stages packages to the public npm registry using Changesets
# with npm OIDC trusted publishing (no NPM_TOKEN required) and
# `npm stage publish` (https://docs.npmjs.com/staged-publishing).
#
# Prerequisites on each package on npmjs.org:
#   1. Settings → Trusted Publishers → this repository + workflow `publish.yml`
#   2. Trusted publisher allowed actions include `npm stage publish`
#      (stage-only is preferred; direct `npm publish` may be disabled org-wide)
#
# After CI succeeds, a maintainer must approve each staged version with 2FA
# (npmjs.com Staged Packages tab, or `npm stage approve <pkg>@<version>`).

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why this release run is being triggered (e.g. retry after trusted publisher / stage-publish setup)'
        required: false
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  attestations: write
  actions: write

jobs:
  provenance:
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_nodejs_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      run-scripts: "install-pnpm, install-deps, build, test"
      node-version: "24.x"
      rekor-log-public: true

  release:
    needs: [provenance]
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gh-app-token
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout Repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.gh-app-token.outputs.token }}
          fetch-depth: 0

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare
        with:
          node-version: "24"
          package-manager-cache: "false"

      - name: Verify dependencies
        run: pnpm audit
        continue-on-error: true

      - name: Create temp dir
        id: temp-dir
        run: |
          set -euo pipefail

          temp_dir=$(mktemp -d)
          echo "path=${temp_dir}" >>"${GITHUB_OUTPUT}"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ github.ref_name }}
          path: ${{ needs.provenance.outputs.package-name }}

      - name: Download tarball
        uses: slsa-framework/slsa-github-generator/.github/actions/secure-download-artifact@4d014fae4dbd39eb09e8d40348b73db095e6ba9a # main
        with:
          name: ${{ needs.provenance.outputs.package-download-name }}
          path: "${{ steps.temp-dir.outputs.path }}/${{ needs.provenance.outputs.package-name }}"
          sha256: ${{ needs.provenance.outputs.package-download-sha256 }}

      - name: Download provenance
        uses: slsa-framework/slsa-github-generator/actions/nodejs/secure-attestations-download@4d014fae4dbd39eb09e8d40348b73db095e6ba9a # v1.6.0
        with:
          name: ${{ needs.provenance.outputs.provenance-download-name }}
          path: "${{ steps.temp-dir.outputs.path }}"
          sha256: ${{ needs.provenance.outputs.provenance-download-sha256 }}

      - name: Unpack the zipped artifact
        run: |
          set -euo pipefail
          cd "${{ steps.temp-dir.outputs.path }}"
          tar -xzvf "${{ needs.provenance.outputs.package-name }}" -C $GITHUB_WORKSPACE --strip-components=1
          cd "$GITHUB_WORKSPACE"
          pnpm run install-deps

      - name: Build packages
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Make files non-executable for GitHub API compatibility
        run: |
          # Make Husky files non-executable (GitHub API doesn't support executable files)
          chmod -x .husky/commit-msg .husky/pre-commit .husky/pre-push 2>/dev/null || true

          # Find and make any other executable files non-executable (except in .husky/)
          find . -type f -executable ! -path "./.husky/*" ! -path "./node_modules/*" ! -path "./.git/*" -exec chmod -x {} \; 2>/dev/null || true

      - name: Configure npm trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # `npm stage publish` requires npm >= 11.15.0. Node 24 currently ships an
      # older bundling (e.g. 11.13.x), so upgrade the global CLI for this job.
      - name: Upgrade npm for staged publishing
        run: npm install -g npm@11.15.0

      - name: Create Release Pull Request or stage packages on npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          # PATH shim rewrites Changesets' `pnpm publish` → `npm stage publish`.
          # Packages land in the npm stage queue until a maintainer approves with 2FA.
          publish: pnpm release:stage
          # Use github-api commit mode for automatic commit signing via GitHub App
          commitMode: "github-api"
          # Use conventional commit format to satisfy commitlint
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.gh-app-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
          TARBALL: ${{ needs.provenance.outputs.package-name }}
          NPM_CONFIG_ACCESS: public
          SKIP_PUBLISH_BUILD: true

      - name: Extract version from package.json
        id: extract_version
        run: |
          version=$(jq -r '.version' package.json)
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          artifact-name: sbom-${{ github.event.repository.name }}-${{ steps.extract_version.outputs.version }}.spdx.json
          output-file: /${{ steps.temp-dir.outputs.path }}/sbom-${{ github.event.repository.name }}-${{ steps.extract_version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c

      - name: Upload attestations SLSA
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: ${{ needs.provenance.outputs.provenance-download-name }}
          subject-name: ${{ github.event.repository.name }}-${{ steps.extract_version.outputs.version }}

      - name: Upload attestations SBOM
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: /${{ steps.temp-dir.outputs.path }}/sbom-${{ github.event.repository.name }}-${{ steps.extract_version.outputs.version }}.spdx.json
