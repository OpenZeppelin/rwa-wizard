---
name: Pre-requisites
description: |
  Setup Pre-requisites for CI

inputs:
  node-version:
    description: Node.js version for setup-node
    required: false
    default: "24"
  package-manager-cache:
    description: Enable setup-node dependency caching (disable for release builds)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      with:
        run_install: false

    - name: Use Node.js ${{ inputs.node-version }}
      if: ${{ inputs.package-manager-cache == 'true' }}
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - name: Use Node.js ${{ inputs.node-version }} (no dependency cache)
      if: ${{ inputs.package-manager-cache != 'true' }}
      uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: ${{ inputs.package-manager-cache }}

    - name: Install dependencies
      run: pnpm install-deps
      shell: bash
