[workspace]
resolver = "2"
members = [
    "contracts/rwa-token",
    "contracts/compliance",
    "contracts/identity-verifier",
    "contracts/claim-topics-issuers",
    "contracts/identity-registry-storage",
    "contracts/modules/compliance-supply-limit",
    "contracts/modules/compliance-max-balance",
    "contracts/modules/compliance-country-restrict",
    "contracts/modules/compliance-country-allow",
    "contracts/modules/compliance-transfer-allow",
    "contracts/modules/compliance-initial-lockup-period",
    "contracts/modules/compliance-time-transfers-limits",
]

[workspace.package]
authors = ["OpenZeppelin"]
edition = "2021"
license = "MIT"
repository = "https://github.com/OpenZeppelin/stellar-contracts"
version = "0.7.1"

[workspace.dependencies]
soroban-sdk = { version = "=26.1.0", features = ["experimental_spec_shaking_v2"] }
stellar-tokens = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "4114bb8e2d7f090bdd9f45731e0607071d5ecea2" }
stellar-access = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "4114bb8e2d7f090bdd9f45731e0607071d5ecea2" }
stellar-macros = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "4114bb8e2d7f090bdd9f45731e0607071d5ecea2" }
stellar-contract-utils = { git = "https://github.com/OpenZeppelin/stellar-contracts.git", rev = "4114bb8e2d7f090bdd9f45731e0607071d5ecea2" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
